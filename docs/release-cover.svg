<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Strela Screen beta 0.6.2</title>
  <desc id="desc">Screen recordings, ready for a phone. Graphite and red artwork with an explicitly labelled illustration of a full-frame overview above an editable detail view. Video processing is local; automatic focus must be reviewed.</desc>
  <rect width="1280" height="640" fill="#101216"/>
  <path d="M837 48V592" stroke="#2d333e"/>
  <g transform="translate(58 49) scale(.5)">
    <rect x="8" y="8" width="112" height="112" rx="30" fill="#ff5056"/>
    <path d="M42 86L89 39M47 39H89V81" fill="none" stroke="#101216" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g font-family="Arial,Helvetica,sans-serif" fill="#f3f5f7">
    <text x="141" y="94" font-size="36" font-weight="700" letter-spacing="-1">strela screen</text>
    <rect x="62" y="162" width="124" height="30" rx="15" fill="#202630" stroke="#404957"/>
    <text x="80" y="182" font-size="12" font-weight="700" letter-spacing="1">BETA 0.6.2</text>
    <text x="58" y="273" font-size="60" font-weight="700" letter-spacing="-2">Screen recordings,</text>
    <text x="58" y="341" font-size="60" font-weight="700" letter-spacing="-2">ready for a phone.</text>
    <text x="62" y="400" font-size="23" fill="#aeb6c3">Import or record. Review focus. Export.</text>
    <path d="M62 459H752" stroke="#2d333e"/>
    <circle cx="68" cy="502" r="5" fill="#ff5056"/>
    <text x="86" y="509" font-size="20">Processed on your device</text>
    <text x="62" y="548" font-size="17" fill="#aeb6c3">Editable focus · MP4, WebM and GIF</text>
    <text x="62" y="582" font-size="15" fill="#aeb6c3">Review automatic focus before sharing.</text>
  </g>
